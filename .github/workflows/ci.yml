name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core runs with zero dependencies
        run: python -m pytest -q
      - name: License + attribution present (D-EXOG-2)
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q "FieldAssist" NOTICE
      - name: No paid-API hostnames (D-EXOG-2 free/open only)
        run: |
          ! grep -RInE "calendarific\.com|api\.openweathermap\.org/data/2\.5/onecall|tomorrow\.io|visualcrossing\.com" exog_signals || (echo "paid host found" && exit 1)
